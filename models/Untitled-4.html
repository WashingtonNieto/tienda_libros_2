<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tabla de Productos</title>
    <style>
        /* Estilos básicos para que la tabla se vea ordenada */
        table {
            width: 100%;
            border-collapse: collapse;
            font-family: sans-serif;
        }
        th, td {
            border: 1px solid #dddddd;
            text-align: left;
            padding: 8px;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <h2>Lista de Productos</h2>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Producto</th>
                <th>Precio</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>001</td>
                <td>Camiseta deportiva</td>
                <td>$25.00</td>
            </tr>
            <tr>
                <td>002</td>
                <td>Pantalón casual</td>
                <td>$45.00</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
