<!DOCTYPE html>
<!--Le decimos al navegador que este archivo es del tipo html:5-->


<html lang="es">
  <!--Es la etiqueta "padre" donde vivira nuestro proyecto. El atributo lang, establece el idioma del sitio web.
Debemos usarlo para que el navegador pueda traducir nuestra pagina-->
  
<head> 
  
<meta charset="utf-8" />
  <!-- Este atributo nos ayuda a la hora de incluir caracteres especiales y emojis en nuestros proyectos-->
  
  <meta name="description"content="Description aqui" />
  
  <!--muestra una descripcion de nuestro sitio en los buscadores-->

  <meta name"robots"content="index,follow" />
  <!--Le dice a los robots de los navegadores que rastreen nuestras pagina y la muestran en las busquedas-->
  
<title>Mi pagina</title>
  <!--Titulo de nuestra pagina, no confundir con los H1-H6. este titulo es el que ves en la pestaña del navegador-->
  
  >meta name="viewport"content="width=divice-width, initial-scale=1.0" />
  <!--nos ayuda a trabajar nuestros proyectos reponsive-->
  
  <link rel="stylesheet"href="./css/style.css">
  <!--linkea/enlaza archivos de estilos u otros archivos que necesitemos en nuestros proyectos-->
  
</head> 
  
  
<body>
  
  <header> <!--seccion superior de nuestro website-->
    
    <nav></nav><!--seccion de navegacion de nuestro website, siempre dentro del header-->
    
    <mian><!--Main es el contenido central de nuestro website, "la parte del medio"-->
      
      <section>
        <!--Nuestro website puede estar divido por secciones, esto facilita mucho el trabajo de organizacion-->
        
        <article>
          <!--contenido independiente de la pagina. Es reutilizable-->
        </article>
        
      </section>
      
      <ul><!--Lista desordenada: Sin numerar-->

    <li><!--Item List. Elementos de la lista--></li>

</ul>

<ol></ol><!--Lista ordenada: Numerada-->

</main>

<footer><!--Sección final de nuestro website-->

</footer>

<p>Soy un texto</p><!--Párrafo, texto-->

<h1>Soy un titulo</h1>
<!--Títulos, muestran el texto más grande y con negrilla. Existen desde el h1 al h6-->

<a href="#">Soy un link</a>
<!--Enlaces/links que nos permitirán movernos entre páginas.-->
      

</body>
</html>
